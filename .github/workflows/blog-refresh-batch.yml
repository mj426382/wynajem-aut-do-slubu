name: 📝 Blog – przepisanie starych wpisów (partiami)

# One-off catch-up: rewrites every legacy post under 900 words, BATCH posts per run, every 30 minutes, with the same
# quality gates, duplicate check, build and SEO check as the regular bot (.github/workflows/blog-bot.yml).
# When no thin post is left, the workflow disables itself. The regular bot keeps refreshing 1 post per run anyway.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Ile wpisów przepisać w tym przebiegu"
        type: number
        default: 5
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: blog-bot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      models: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests -q

      - name: How many thin posts are left
        id: left
        run: |
          n=$(python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts/blog')
          from site_context import load_posts, word_count_html
          led = json.load(open('scripts/blog/blog-keywords-used.json', encoding='utf-8'))
          done = {u.get('slug') for u in led if u.get('kind') in ('refresh', 'refresh-failed')}
          print(sum(1 for p in load_posts() if word_count_html(p['content']) < 900 and p['slug'] not in done))
          PY
          )
          echo "left=$n" >> "$GITHUB_OUTPUT"
          echo "### Do przepisania zostało: $n" >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing left – disable this workflow
        if: steps.left.outputs.left == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow disable "blog-refresh-batch.yml" --repo "$GITHUB_REPOSITORY"

      - name: Rewrite a batch of posts (AI + quality gates)
        id: rewrite
        if: steps.left.outputs.left != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_MODE: refresh
          BATCH: ${{ inputs.batch || 5 }}
        run: |
          for i in $(seq 1 "$BATCH"); do
            echo "::group::Wpis $i/$BATCH"
            python3 scripts/blog/generate_blog_post.py || echo "::warning::Wpis $i nie przeszedł bramek – pominięty"
            echo "::endgroup::"
          done
          git status --short

      - name: No duplicate blog posts
        if: steps.left.outputs.left != '0'
        run: python3 scripts/blog/check_blog_duplicates.py

      - uses: actions/setup-node@v4
        if: steps.left.outputs.left != '0'
        with:
          node-version: 24
          cache: npm

      - name: Lint, build, prerender and check the site
        if: steps.left.outputs.left != '0'
        run: |
          npm ci
          npm run lint
          npm run build
          node scripts/check-build.js

      - name: Publish to main (Vercel deploys)
        if: steps.left.outputs.left != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/blog/posts public/sitemap.xml scripts/blog/blog-keywords-used.json
          if git diff --cached --quiet; then echo "Nic do zapisania"; exit 0; fi
          n=$(git diff --cached --name-only -- src/blog/posts | wc -l)
          git commit -m "feat(blog): przepisano ${n} starych wpisów ($(date -u +%F))"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 15
          done
          echo "::error::Could not push to main"
          exit 1
